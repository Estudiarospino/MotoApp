# Plantilla de referencia — copiar a /etc/nginx/sites-available/motoapp,
# ajustar server_name al dominio real, symlink a sites-enabled y recargar:
#   sudo ln -s /etc/nginx/sites-available/motoapp /etc/nginx/sites-enabled/motoapp
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name motoapp.TUDOMINIO.com;

    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
